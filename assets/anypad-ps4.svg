<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a21"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa53a"/>
      <stop offset="1" stop-color="#f07400"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- waves: the controller over the network -->
  <g fill="none" stroke="#ffb35c" stroke-linecap="round" stroke-width="13">
    <path d="M206 92 a70 70 0 0 1 100 0" stroke-opacity="0.95"/>
    <path d="M176 64 a112 112 0 0 1 160 0" stroke-opacity="0.55"/>
  </g>

  <!-- the controller: the menu's AnyPad silhouette -->
  <g transform="translate(64,-6) scale(16)">
    <path d="M7.2 7h9.6a5 5 0 0 1 4.9 6l-.9 4.2a2.5 2.5 0 0 1-4.4 1L14.8 16H9.2l-1.6 2.2a2.5 2.5 0 0 1-4.4-1L2.3 13a5 5 0 0 1 4.9-6z"
          fill="url(#pad)"/>
    <!-- d-pad -->
    <rect x="6.55" y="10.3" width="1.3" height="4.0" rx="0.35" fill="#141418"/>
    <rect x="5.2" y="11.65" width="4.0" height="1.3" rx="0.35" fill="#141418"/>
    <!-- face buttons: plain dots -->
    <circle cx="16.9" cy="10.75" r="0.78" fill="#141418"/>
    <circle cx="18.45" cy="12.3" r="0.78" fill="#141418"/>
    <circle cx="16.9" cy="13.85" r="0.78" fill="#141418"/>
    <circle cx="15.35" cy="12.3" r="0.78" fill="#141418"/>
  </g>

  <!-- the name -->
  <text x="256" y="402" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="84" font-weight="800" letter-spacing="-1">
    <tspan fill="#ff8a00">Any</tspan><tspan fill="#f4f6fb">Pad</tspan>
  </text>
  <text x="256" y="462" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="44" font-weight="700" letter-spacing="10" fill="#8e94a3">PS4</text>
</svg>
