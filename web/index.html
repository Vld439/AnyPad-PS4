<title>AnyPad PS4</title>
<style>
:root {
  --bg: #08080a; --surface: #101014; --card: rgba(24,24,28,.88); --card2: #15151a; --line: rgba(255,255,255,.08);

  --ok: #3ddc84; --bad: #ff4d5e; --chip: rgba(255,138,0,.14);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--text); background: var(--bg);
  background-image: radial-gradient(900px 520px at 85% -10%, rgba(255,138,0,.14), rgba(0,0,0,0) 60%),
                    radial-gradient(700px 420px at -10% 110%, rgba(46,230,166,.07), rgba(0,0,0,0) 60%);
  font: 15px/1.45 Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.meta, #ver, .neturl { unicode-bidi: plaintext; }
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
/* ---- side bar ---- */
.side { background: rgba(16,16,20,.92); border-inline-end: 1px solid var(--line); padding: 18px 14px;
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); display: grid; place-items: center;
  box-shadow: 0 0 22px var(--accent-glow); color: #141414; }
.logo svg { width: 24px; height: 24px; }
.brand b { font-size: 18px; letter-spacing: .3px; } .brand b span { color: var(--accent); }
.brand small { display: block; color: var(--dim); font-size: 11px; direction: ltr; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; border: 0;
  background: transparent; color: #c9cdd6; padding: 11px 14px; border-radius: 12px; font: inherit;
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; }
.nav button svg { width: 19px; height: 19px; flex: none; opacity: .85; }
.nav button:hover, .nav button:focus { background: rgba(255,255,255,.05); outline: none; }
.nav button.on { background: var(--accent); color: #141414; box-shadow: 0 6px 22px var(--accent-glow); }
.side .grow { flex: 1; }
#status { align-self: flex-start; font-size: 12px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
#status.on { border-color: rgba(61,220,132,.5); color: var(--ok); }
#status.off { border-color: rgba(255,77,94,.5); color: var(--bad); }
/* ---- content ---- */
main { padding: 26px 30px 40px; max-width: 1100px; width: 100%; }
.view[hidden] { display: none; }
h1.title { margin: 0 0 18px; font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
h1.title span { color: var(--accent); }
h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { color: var(--dim); font-size: 13px; }
button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
  padding: 9px 16px; border-radius: 12px; cursor: pointer; }
button:hover, button:focus { border-color: rgba(255,138,0,.65); outline: none; }
button.solid { background: var(--accent); border-color: var(--accent); color: #141414; font-weight: 700; box-shadow: 0 6px 20px var(--accent-glow); }
button.blue { background: #0070d1; border-color: #0070d1; color: #fff; font-weight: 700; }
button.danger { border-color: rgba(255,77,94,.55); color: var(--bad); background: rgba(255,77,94,.06); }
button:disabled { opacity: .45; cursor: default; box-shadow: none; }
/* ---- network controller ---- */
.neturl { font-size: 22px; font-weight: 700; color: var(--accent); direction: ltr; word-break: break-all; margin: 2px 0 6px; }
/* ---- pads ---- */
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.pad { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card2); }
.pad .top { display: flex; align-items: center; gap: 10px; }
.pad .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--accent); flex: none; }
.pad .ico svg { width: 22px; height: 22px; }
.pad .name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad .slot { color: #141414; background: var(--accent); border-radius: 8px; padding: 1px 9px; font-size: 12px; font-weight: 800; }
.pad .meta { color: var(--dim); font-size: 12px; margin: 4px 0 12px; }
.pad .acts { display: flex; justify-content: flex-end; margin-top: 12px; }
.viz { display: flex; gap: 14px; align-items: center; justify-content: center; }
.stick { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.10); position: relative; background: rgba(255,255,255,.02); }
.stick i { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.trig { width: 10px; height: 62px; border: 1px solid rgba(255,255,255,.10); border-radius: 5px; position: relative; overflow: hidden; }
.trig b { position: absolute; bottom: 0; left: 0; right: 0; background: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; min-height: 24px; }
.btns span { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--accent-ink); font-weight: 700; }
/* ---- log ---- */
pre { margin: 12px 0 0; max-height: 360px; overflow: auto; font-size: 12px; color: #d8dbe2; direction: ltr; text-align: left;
  background: #0b0b0e; border: 1px solid var(--line); border-radius: 12px; padding: 12px; white-space: pre-wrap; }
.empty { color: var(--dim); font-size: 14px; padding: 6px 0; }
/* ---- narrow screens: the side bar becomes a top bar ---- */
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 12px; flex-direction: column; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { width: auto; flex: none; padding: 9px 12px; font-size: 12px; }
  .side .grow { display: none; }
  main { padding: 16px; }
}

        <span class="hint" data-t="stophint"></span>

  L = Object.assign({}, TEXT.en, TEXT[code] || {});     /* a text not translated yet shows in English */
  document.documentElement.lang = code;
  document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
  for (const e of document.querySelectorAll("[data-t]")) {
    const v = L[e.dataset.t];
    if (typeof v !== "string") continue;
    if (e.dataset.html) e.innerHTML = v; else e.textContent = v;
  }
  if (!$("log").hidden) $("showlog").textContent = L.hidelog;
}
/* The side bar: one view at a time. */
function showView(v) {
  for (const b of document.querySelectorAll(".nav button")) b.classList.toggle("on", b.dataset.v === v);
  for (const sec of document.querySelectorAll(".view")) sec.hidden = sec.id !== "v-" + v;
  try { sessionStorage.setItem("anypad-view", v); } catch (e) {}
}
for (const b of document.querySelectorAll(".nav button")) b.onclick = () => showView(b.dataset.v);
setLang("es");

const NAMES = { cross: "✕", circle: "○", square: "□", triangle: "△", l1: "L1", r1: "R1", l2: "L2", r2: "R2",
  l3: "L3", r3: "R3", up: "↑", down: "↓", left: "←", right: "→", options: "OPTIONS", create: "SHARE",
  ps: "PS", touchpad: "PANEL" };
async function api(method, path) {
  const r = await fetch(path, { method, headers: { "X-AnyPad": "1" } });
  if (!r.ok) throw new Error("http " + r.status);
  return path === "/api/log" ? r.text() : r.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function stick(x, y) {
  const s = el("div", "stick"), d = el("i");
  d.style.left = (x / 255 * 100) + "%";
  d.style.top = (y / 255 * 100) + "%";
  s.appendChild(d);
  return s;
}

function trigger(v) {
  const t = el("div", "trig"), b = el("b");
  b.style.height = (v / 255 * 100) + "%";
  t.appendChild(b);
  return t;
}

function renderPads(pads) {
  const box = $("pads");
  box.replaceChildren();
  if (!pads.length) { box.appendChild(el("div", "empty", L.nopads)); return; }
  for (const p of pads) {
    const c = el("div", "pad"), top = el("div", "top"), ico = el("span", "ico");
    ico.innerHTML = PAD_SVG;
    /* "network" or "network:<the name its browser gave>"; a USB pad: its profile */
    const net = p.label === "network" || p.label.startsWith("network:");
    top.append(ico, el("span", "name", net ? p.label.slice(8) || L.nettitle : p.label), el("span", "slot", L.pl + p.slot));
    c.append(top, el("div", "meta", net ? L.nettitle : "USB"));
    const viz = el("div", "viz");
    viz.append(trigger(p.l2), stick(p.lx, p.ly), stick(p.rx, p.ry), trigger(p.r2));
    c.appendChild(viz);
    const btns = el("div", "btns");
    for (const b of p.buttons) btns.appendChild(el("span", "", NAMES[b] || b));
    c.appendChild(btns);
    /* For pads with no PS button: the same as holding PS on it. */
    const acts = el("div", "acts"), ps = el("button", "blue", L.pressps);
    ps.title = L.presspshint;
    ps.onclick = async () => { try { await api("POST", "/api/ps?slot=" + p.slot); } catch (e) {} };
    acts.appendChild(ps);
    c.appendChild(acts);
    box.appendChild(c);
  }
}

async function refresh() {
  try {
    const s = await api("GET", "/api/state");
    setLang(TEXT[s.lang] ? s.lang : "en");
    $("ver").textContent = s.version;
    $("status").textContent = L.running;
    $("status").className = "on";
    $("neturl").textContent = s.net && s.net.url ? s.net.url : "";
    $("netstate").textContent = L.netclients(s.net ? s.net.clients : 0);
    renderPads(s.pads || []);
  } catch (e) {
    $("status").textContent = L.offline;
    $("status").className = "off";
  }
}

$("exit").onclick = () => {
  /* Only leaves the page: AnyPad PS4 keeps running. Browsers refuse to close a page they did
     not open from a script, so fall back to going back, then say how to leave. */
  try { window.close(); } catch (e) {}
  setTimeout(() => { if (history.length > 1) history.back(); }, 250);
  setTimeout(() => { $("exithint").textContent = L.exitfail; }, 800);
};
$("stop").onclick = async () => {
  if (!confirm(L.stopq)) return;
  try { await api("POST", "/api/stop"); } catch (e) {}
  $("status").textContent = L.stopping;
};
$("showlog").onclick = async () => {
  const pre = $("log");
  if (!pre.hidden) { pre.hidden = true; $("showlog").textContent = L.showlog; return; }
  try { pre.textContent = await api("GET", "/api/log"); } catch (e) { return; }
  pre.hidden = false;
  pre.scrollTop = pre.scrollHeight;
  $("showlog").textContent = L.hidelog;
};

try { const v = sessionStorage.getItem("anypad-view"); if (v && $("v-" + v)) showView(v); } catch (e) {}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
